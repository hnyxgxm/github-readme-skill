<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">合格样本：整宽背景、系统字体、字号足够</title>
  <desc id="d">用于自测的合格图，1200 单位宽，最小字号 22 单位，渲染后约 15px。</desc>
  <rect width="1200" height="320" fill="#0d1117"/>
  <text x="80" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="44" fill="#f0f6fc">合格样本</text>
  <text x="80" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="22" fill="#8b949e">这一段文字在 838px 正文列里约 15px</text>
</svg>
