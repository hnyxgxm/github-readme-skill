<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="同一个项目首页改版前后">
  <title>同一个项目首页，改版前后</title>
  <desc>左边是改前：首屏堆着一整屏正文和示范清单，安装命令埋在中段。右边是改后：首屏只有项目名、一句定位、三个徽章和一条安装命令，首屏之后紧跟安装。</desc>
  <style>
    .bg { fill: #0d1117; }
    .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .tag { font-size: 30px; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }
    .cap { font-size: 26px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }
    .line { fill: #30363d; }
    .line-strong { fill: #6e7681; }
    .pill { fill: #21262d; stroke: #30363d; stroke-width: 1; }
    .mono { font-size: 24px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <rect class="bg" width="1200" height="340"/>

  <!-- 改前：一整屏字，安装埋在中段 -->
  <rect class="panel" x="24" y="24" width="568" height="292" rx="18"/>
  <text class="tag" x="56" y="78" fill="#f85149">改前</text>
  <rect class="line" x="56" y="100" width="430" height="9" rx="4.5"/>
  <rect class="line" x="56" y="117" width="482" height="9" rx="4.5"/>
  <rect class="line" x="56" y="134" width="452" height="9" rx="4.5"/>
  <rect class="line" x="56" y="151" width="476" height="9" rx="4.5"/>
  <rect class="line" x="56" y="168" width="410" height="9" rx="4.5"/>
  <rect class="line" x="56" y="185" width="468" height="9" rx="4.5"/>
  <rect class="line" x="56" y="202" width="438" height="9" rx="4.5"/>
  <rect class="line" x="56" y="219" width="462" height="9" rx="4.5"/>
  <rect class="line-strong" x="56" y="244" width="392" height="24" rx="6" opacity="0.5"/>
  <text class="cap" x="56" y="300" fill="#f85149">安装埋在中段，读者要滚过半份文档</text>

  <!-- 改后：四件套，安装紧跟着 -->
  <rect class="panel" x="608" y="24" width="568" height="292" rx="18"/>
  <text class="tag" x="640" y="78" fill="#3fb950">改后</text>
  <rect class="line-strong" x="640" y="100" width="238" height="22" rx="6"/>
  <rect class="line" x="640" y="138" width="470" height="9" rx="4.5"/>
  <rect class="line" x="640" y="155" width="372" height="9" rx="4.5"/>
  <rect class="pill" x="640" y="180" width="70" height="20" rx="10"/>
  <rect class="pill" x="722" y="180" width="56" height="20" rx="10"/>
  <rect class="pill" x="790" y="180" width="72" height="20" rx="10"/>
  <rect x="640" y="216" width="470" height="42" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text class="mono" x="660" y="244" fill="#3fb950">npx skills add … -g</text>
  <text class="cap" x="640" y="300" fill="#3fb950">首屏之后就是安装，一条命令</text>
</svg>
